name: money-flow-test

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: money-flow-postgres-test
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: money_flow_test
      POSTGRES_PASSWORD: synthetic-test-password
      POSTGRES_DB: money_flow_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money_flow_test -d money_flow_test"]
      interval: 5s
      timeout: 3s
      retries: 10
